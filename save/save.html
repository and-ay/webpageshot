<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="savePageTitle">WebPageShot</title>
  <link rel="icon" href="../icons/icon32.png?v=5">
  <link rel="stylesheet" href="save.css">
</head>
<body>
  <main>
    <div class="thumb" id="thumb-wrap" hidden><img id="thumb" alt=""></div>
    <h1 id="title"></h1>
    <p id="text"></p>
    <p class="status" id="status" role="status"></p>
    <div class="actions">
      <button id="cancel" class="ghost" data-i18n="cancel"></button>
      <button id="alt" class="ghost" hidden></button>
      <button id="action" class="primary"></button>
    </div>
  </main>
  <script type="module" src="save.js"></script>
</body>
</html>
